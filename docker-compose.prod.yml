version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    container_name: rootnote-backend-prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - FRONTEND_URL=${FRONTEND_URL:-https://rootnote.yourdomain.com}
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - DATABASE_PATH=/app/data/rootnote.db
    volumes:
      - backend-data:/app/data
    restart: always
    networks:
      - rootnote-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: rootnote-frontend-prod
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - rootnote-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Nginx reverse proxy with SSL (recommended for production)
  nginx-proxy:
    image: nginx:alpine
    container_name: rootnote-nginx-proxy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - rootnote-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Optional: Backup service for database
  backup:
    image: alpine:latest
    container_name: rootnote-backup
    volumes:
      - backend-data:/data:ro
      - ./backups:/backups
    environment:
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *} # Daily at 2 AM
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    command: >
      sh -c "
        apk add --no-cache dcron &&
        echo '$${BACKUP_SCHEDULE} cp /data/rootnote.db /backups/rootnote-\$$(date +\%Y\%m\%d-\%H\%M\%S).db && find /backups -name \"rootnote-*.db\" -mtime +$${BACKUP_RETENTION_DAYS} -delete' | crontab - &&
        crond -f -l 2
      "
    restart: always
    networks:
      - rootnote-network

networks:
  rootnote-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  backend-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data/backend}
  nginx-cache:
    driver: local
